[project]
name = "jetstream-backend"
version = "0.1.0"
description = "JetStream AI backend: quote intelligence for private aviation charter brokers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142",
    "uvicorn[standard]",
    "pydantic>=2.13",
    "pydantic-settings",
    "email-validator",
    "sqlalchemy>=2.0.36",
    "alembic",
    "pyjwt",
    "pwdlib[argon2]",
    "python-multipart",
    "pypdf",
    "anthropic>=1.9,<2",
    "tzdata",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "httpx",
    "hypothesis",
    "time-machine",
    "ruff",
    "mypy",
    "reportlab",
    "pillow",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions/*.py.mako"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's `Depends(...)` in argument defaults is idiomatic.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Cookie",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"alembic/versions/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pypdf.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "integration: exercises several packages together (pipeline, full API flow)",
    "e2e: slow end-to-end checks such as the demo seed oracle",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
branch = true
